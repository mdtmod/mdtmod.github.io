
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>KeyDrop - Nhận Key Miễn Phí</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #0b1020;
      --panel: #141c30;
      --border: #28344d;
      --text: #f2f5ff;
      --muted: #98a6c2;
      --accent: #8b9cff;
      --green: #55e0ad;
      --red: #ff7e91;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, #1d2c50, transparent 60%),
        var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 21px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      color: #10172a;
      background: var(--accent);
    }

    main {
      max-width: 560px;
      margin: 35px auto;
    }

    .hero { text-align: center; margin-bottom: 28px; }

    .tag {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(32px, 8vw, 44px);
      letter-spacing: -1.5px;
      margin: 12px 0;
    }

    .muted { color: var(--muted); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 60px #0002;
    }

    .balance {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .balance-label { font-size: 13px; color: var(--muted); }

    .number {
      font-size: 38px;
      font-weight: 800;
      margin-top: 4px;
    }

    .badge {
      font-size: 12px;
      padding: 7px 10px;
      color: var(--green);
      background: #55e0ad12;
      border: 1px solid #55e0ad44;
      border-radius: 20px;
      white-space: nowrap;
    }

    .progress {
      height: 6px;
      margin: 18px 0 24px;
      overflow: hidden;
      border-radius: 20px;
      background: #ffffff12;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width .3s;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }

    button:active { transform: scale(.98); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .primary {
      width: 100%;
      background: var(--accent);
      color: #10172a;
    }

    .result {
      margin-top: 20px;
      padding: 17px;
      border: 1px solid #55e0ad55;
      border-radius: 14px;
      background: #55e0ad08;
    }

    .result-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .key {
      color: var(--green);
      font-family: ui-monospace, monospace;
      font-size: 16px;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }

    .copy {
      width: 100%;
      margin-top: 14px;
      color: var(--text);
      background: #ffffff10;
      border: 1px solid var(--border);
    }

    .message {
      margin-top: 16px;
      padding: 13px;
      border-radius: 12px;
      background: #ffffff08;
      line-height: 1.6;
      font-size: 14px;
    }

    .error { color: var(--red); }
    .success { color: var(--green); }
    .hidden { display: none; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .stat {
      padding: 15px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      text-align: center;
      min-width: 0;
    }

    .stat-label { font-size: 11px; color: var(--muted); }
    .stat-number { font-size: 23px; font-weight: 800; margin-top: 7px; }

    footer {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 400px) {
      body { padding: 14px; }
      .panel { padding: 18px; }
      .stats { gap: 7px; }
      .stat { padding: 13px 5px; }
      .stat-number { font-size: 20px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">K</div>
    <span>Key Aov Mod</span>
  </header>

  <main>
    <section class="hero">
      <div class="tag">Timi Map LQ</div>
      <h1>Nhận key của bạn.</h1>
      <p class="muted">
        Nhận một key ngẫu nhiên mỗi ngày.
        Nhanh chóng, đơn giản và miễn phí.
      </p>
    </section>

    <section class="panel">
      <div class="balance">
        <div>
          <div class="balance-label">Key còn trong kho</div>
          <div class="number" id="remaining">0</div>
        </div>
        <div class="badge" id="status">● Sẵn sàng</div>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progress"></div>
      </div>

      <button class="primary" id="claimBtn">
        Nhận key ngẫu nhiên
      </button>

      <div class="result hidden" id="result" aria-live="polite">
        <div class="result-label">KEY CỦA BẠN</div>
        <div class="key" id="keyValue"></div>
        <button class="copy" id="copyBtn">Sao chép key</button>
      </div>

      <div class="message hidden" id="message" role="status"></div>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Tổng key</div>
        <div class="stat-number" id="total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Đã phát</div>
        <div class="stat-number" id="issued">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Hôm nay</div>
        <div class="stat-number" id="today">0</div>
      </div>
    </section>

    <footer>
      Timi Aov · Hệ thống phân phối key hằng ngày<br>
      Mỗi thiết bị tối đa một key mỗi ngày.
    </footer>
  </main>

  <script>
    /*
      THÊM KEY TẠI ĐÂY:
      Mỗi key đặt trong dấu nháy, cách nhau bằng dấu phẩy.
    */
    const KEYS = [
      "DEMO-KEY-001",
      "DEMO-KEY-002",
      "DEMO-KEY-003",
      "DEMO-KEY-004",
      "DEMO-KEY-005"
    ];

    const $ = id => document.getElementById(id);
    const STORAGE_KEY = "keydrop_claim_history_v1";

    function today() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Ho_Chi_Minh",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
      return `${p.year}-${p.month}-${p.day}`;
    }

    function readHistory() {
      try {
        const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return value && typeof value === "object" &&
          !Array.isArray(value) ? value : {};
      } catch {
        return {};
      }
    }

    function saveHistory(history) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function claimedKeys(history) {
      return new Set(Object.values(history).flatMap(v =>
        Array.isArray(v) ? v : []
      ));
    }

    function availableKeys() {
      const history = readHistory();
      const claimed = claimedKeys(history);
      return KEYS.filter(k => !claimed.has(k));
    }

    function showMessage(text, type = "") {
      const el = $("message");
      el.textContent = text;
      el.className = `message ${type}`;
    }

    function updateUI() {
      const history = readHistory();
      const available = availableKeys();
      const issued = KEYS.length - available.length;
      const todayList = Array.isArray(history[today()])
        ? history[today()] : [];

      $("remaining").textContent = available.length;
      $("total").textContent = KEYS.length;
      $("issued").textContent = issued;
      $("today").textContent = todayList.length;

      $("progress").style.width = KEYS.length
        ? `${issued / KEYS.length * 100}%`
        : "0%";

      $("claimBtn").disabled =
        available.length === 0 || todayList.length > 0;

      if (available.length === 0) {
        $("status").textContent = "● Hết key";
        $("claimBtn").textContent = "Kho key đã hết";
      } else if (todayList.length > 0) {
        $("status").textContent = "● Đã nhận hôm nay";
        $("claimBtn").textContent = "Bạn đã nhận key hôm nay";
      } else {
        $("status").textContent = "● Sẵn sàng";
        $("claimBtn").textContent = "Nhận key ngẫu nhiên";
      }
    }

    $("claimBtn").addEventListener("click", () => {
      const history = readHistory();
      const day = today();

      if (!Array.isArray(history[day])) history[day] = [];

      if (history[day].length > 0) {
        showMessage("Bạn đã nhận key hôm nay. Hãy quay lại vào ngày mai.");
        updateUI();
        return;
      }

      const available = availableKeys();

      if (available.length === 0) {
        showMessage("Kho key đã hết. Vui lòng quay lại sau.", "error");
        updateUI();
        return;
      }

      const key = available[Math.floor(Math.random() * available.length)];

      history[day].push(key);

      try {
        saveHistory(history);
      } catch {
        showMessage(
          "Không thể lưu lịch sử trên trình duyệt này. Hãy bật lưu trữ trang web rồi thử lại.",
          "error"
        );
        return;
      }

      $("keyValue").textContent = key;
      $("result").classList.remove("hidden");
      showMessage("Nhận key thành công! Hãy sao chép và lưu key của bạn.", "success");
      updateUI();
    });

    $("copyBtn").addEventListener("click", async () => {
      const key = $("keyValue").textContent;

      try {
        await navigator.clipboard.writeText(key);
        $("copyBtn").textContent = "Đã sao chép!";
      } catch {
        const area = document.createElement("textarea");
        area.value = key;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();

        const success = document.execCommand("copy");
        area.remove();

        $("copyBtn").textContent = success
          ? "Đã sao chép!"
          : "Hãy sao chép key thủ công";
      }

      setTimeout(() => {
        $("copyBtn").textContent = "Sao chép key";
      }, 1800);
    });

    // Hiện lại key đã nhận trong ngày hiện tại.
    function restoreTodayKey() {
      const history = readHistory();
      const keys = history[today()];

      if (Array.isArray(keys) && keys.length > 0) {
        $("keyValue").textContent = keys[keys.length - 1];
        $("result").classList.remove("hidden");
        showMessage("Bạn đã nhận key hôm nay.", "success");
      }
    }

    restoreTodayKey();
    updateUI();
  </script>
</body>
</html>
